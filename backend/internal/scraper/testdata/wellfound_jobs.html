<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wellfound Startup Jobs</title>
</head>
<body>
    <div class="listings-wrapper">
        <!-- Job 1 -->
        <div data-test="JobListingCard" class="job-listing">
            <h2 data-test="job-title" class="job-title">Junior Backend Developer</h2>
            <h4 data-test="company-name" class="company-name">Postman</h4>
            <span data-test="job-location" class="location">Bangalore</span>
            <span data-test="job-role" class="role">Software Engineer</span>
            <p data-test="job-description">Build scalable APIs and microservices in Go.</p>
            <a data-test="job-link" href="/jobs/101-junior-backend-developer">View Job</a>
        </div>

        <!-- Job 2 -->
        <article class="job-card">
            <h3 class="job-title">Growth Associate - Fresher</h3>
            <span class="company-name">Zepto</span>
            <span class="locations">Mumbai</span>
            <span class="role-tag">Growth</span>
            <p class="description">Fast-paced quick commerce growth operations.</p>
            <a href="/jobs/102-growth-associate-fresher">Apply Now</a>
        </article>

        <!-- Empty / Irrelevant Card -->
        <div data-test="JobListingCard">
            <span>Sponsored Ad</span>
        </div>
    </div>
</body>
</html>
